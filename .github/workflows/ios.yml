name: iOS build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - INSTALL.md
      - DEVICE-CHECKLIST.md
      - Verification/**
      - References/**/*.md
      - References/**/*.jpg
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Swift logic
        run: swift test
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID="$(./scripts/verify-macos.sh --select-simulator)"
          printf 'SIMULATOR_ID=%s\n' "$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Compile the unsigned physical-device application
        run: |
          set -o pipefail
          ./scripts/verify-macos.sh device 2>&1 | tee device-build.log
      - name: Package the unsigned physical-device application
        if: always()
        run: |
          DEVICE_APP_PATH=build-device/Build/Products/Release-iphoneos/Reverie.app
          if [ -d "$DEVICE_APP_PATH" ]; then
            mkdir -p build-device/package/Payload
            ditto "$DEVICE_APP_PATH" build-device/package/Payload/Reverie.app
            ditto -c -k --keepParent build-device/package/Payload Reverie-unsigned.ipa
          fi
      - name: Build all unsigned brand variants
        run: |
          set -o pipefail
          ./scripts/build-brand-variants.sh 2>&1 | tee variants-build.log
      - name: Build and run unit and UI tests
        env:
          IOS_TEST_DESTINATION: platform=iOS Simulator,id=${{ env.SIMULATOR_ID }}
          IOS_TEST_RESULT_BUNDLE: TestResults.xcresult
        run: |
          set -o pipefail
          ./scripts/verify-macos.sh test 2>&1 | tee build.log
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-attachments
          fi
      - name: Launch app and capture simulator screenshot
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/Build/Products/Debug-iphonesimulator/Reverie.app
          xcrun simctl launch "$SIMULATOR_ID" com.reverie.simulator
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot simulator.png
          ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/Reverie.app Reverie-simulator.zip
      - name: Capture installed startup for all five scene styles
        run: |
          set -o pipefail
          ./scripts/verify-brand-startup.sh 2>&1 | tee brand-startup.log
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-ios-build
          path: |
            device-build.log
            build.log
            TestResults.xcresult
            test-attachments
            simulator.png
            Reverie-simulator.zip
            variants-build.log
            brand-startup.log
            brand-artifacts
            !brand-artifacts/*.ipa
          if-no-files-found: warn
      - name: Upload unsigned physical-device packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reverie-unsigned-apps
          path: |
            Reverie-unsigned.ipa
            brand-artifacts/*.ipa
            brand-artifacts/manifest.json
          compression-level: 0
          if-no-files-found: warn
