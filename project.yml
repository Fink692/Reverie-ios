name: Reverie
options:
  bundleIdPrefix: com.reverie
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Reverie
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Reverie:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reverie.simulator
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ReverieTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Reverie
schemes:
  Reverie:
    build:
      targets:
        Reverie: all
        ReverieTests: [test]
    test:
      targets: [ReverieTests]
